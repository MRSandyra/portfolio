name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose config -q

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-postgres==1.8.2

      - name: Lint dbt project (parse only, no live warehouse in CI)
        run: |
          cd dbt_project
          dbt deps
          dbt parse --profiles-dir . --target dev
        env:
          WAREHOUSE_DB_HOST: localhost
          WAREHOUSE_DB_NAME: warehouse
          WAREHOUSE_DB_USER: airflow
          WAREHOUSE_DB_PASSWORD: airflow
